<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>蔬菜戀愛任務 🥬</title>

    <style>
      body {
        margin: 0;
        background: #f7f7f2;
        color: #333;
        font-family:
          -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif;
      }

      .container {
        max-width: 480px;
        margin: 0 auto;
        padding: 24px;
      }

      .header {
        background: #dfead8;
        padding: 24px;
        border-radius: 24px;
      }

      .header h1 {
        margin: 8px 0;
        font-size: 28px;
      }

      .header p {
        margin: 0;
        color: #66705f;
      }

      .points {
        margin-top: 24px;
        font-size: 36px;
        font-weight: bold;
      }

      .progress-bg {
        height: 10px;
        background: rgba(255, 255, 255, 0.7);
        border-radius: 10px;
        margin-top: 12px;
        overflow: hidden;
      }

      .progress {
        width: 0%;
        height: 100%;
        background: #7da66d;
        border-radius: 10px;
      }

      .progress-text {
        margin-top: 8px;
        font-size: 13px;
        color: #66705f;
      }
    </style>
  </head>

  <body>
    <main class="container">
      <section class="header">
        <div>🥬 OUR LITTLE VEGGIE QUEST</div>

        <h1>今天也一起吃菜吧</h1>

        <p>午餐＋晚餐，各一拳頭蔬菜就好 ❤️</p>

        <div class="points">0 點</div>

        <div class="progress-bg">
          <div class="progress"></div>
        </div>

        <div class="progress-text">距離第一個願望還有 30 點</div>
      </section>
      <section class="card">
        <div class="meal-header">
          <div>
            <div class="meal-title">☀️ 午餐</div>
            <div class="meal-subtitle">今天的菜菜任務</div>
          </div>

          <span class="status"> 未完成 </span>
        </div>

        <!-- 拍照區 -->
        <label class="photo-box">
          <div class="photo-content">
            <div class="photo-icon">📸</div>

            <div>拍下今天的午餐</div>

            <small> 有蔬菜就可以打卡！ </small>
          </div>

          <input type="file" accept="image/*" capture="environment" />
        </label>

        <!-- 任務 -->
        <label class="task">
          <input type="checkbox" />

          <div class="task-text">
            🥬 一拳頭蔬菜
            <small> 大約一個拳頭的份量 </small>
          </div>

          <strong> +2 </strong>
        </label>

        <label class="task">
          <input type="checkbox" />

          <div class="task-text">
            ✨ 第一口先吃菜
            <small> 吃其他東西以前，先吃一口菜 </small>
          </div>

          <strong> +1 </strong>
        </label>
      </section>
    </main>
  </body>
</html>
